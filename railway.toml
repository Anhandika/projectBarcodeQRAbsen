[build]
builder = "NIXPACKS"
buildCommand = "composer install --no-dev --optimize-autoloader --no-interaction && npm ci && npm run build"

[deploy]
startCommand = "bash -c 'php artisan storage:link || true; php artisan migrate --force --no-interaction; php artisan db:seed --force --no-interaction || true; if [ ! -f .env ]; then cp .env.example .env; fi; php artisan key:generate --force; php artisan config:cache; php artisan route:cache; php artisan view:cache; php artisan serve --host=0.0.0.0 --port=${PORT:-8000}'"
healthcheckPath = "/up"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
